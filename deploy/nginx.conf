server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;
    client_max_body_size 4k;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api:8080;
    }

    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
