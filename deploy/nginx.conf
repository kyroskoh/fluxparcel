server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;
    client_max_body_size 4k;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location = /v1/events {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 45s;
    }

    # File parts are at most 8 MiB; stream them to the API without buffering whole bodies on disk.
    location ~ ^/v1/transfers/[0-9a-f-]+/parts/[0-9]+$ {
        client_max_body_size 8m;
        proxy_request_buffering off;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_pass http://api:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Completion re-hashes the assembled file before publishing it.
    location ~ ^/v1/transfers/[0-9a-f-]+/complete$ {
        proxy_read_timeout 600s;
        proxy_pass http://api:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/v1/files/[0-9a-f-]+/content$ {
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://api:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api:8080;
    }

    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
