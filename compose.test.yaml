# Test-only override: publishes PostgreSQL and S3 on loopback so storage integration tests can reach them.
# Use it only with disposable stacks, for example COMPOSE_FILE=compose.yaml:compose.test.yaml in CI.
services:
  postgres:
    ports:
      - "127.0.0.1:55432:5432"
  s3:
    ports:
      - "127.0.0.1:59000:9000"
