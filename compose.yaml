services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fluxparcel
      POSTGRES_DB: fluxparcel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxparcel -d fluxparcel"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: rustfs/rustfs:1.0.0-alpha.83
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - objects:/data

  bucket:
    image: fluxparcel-api:local
    pull_policy: never
    command: ["init-storage"]
    depends_on:
      s3:
        condition: service_started
    environment: &storage
      APP_ENV: development
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: fluxparcel

  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"

  migrate:
    image: fluxparcel-api:local
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: &database postgres://fluxparcel:${POSTGRES_PASSWORD}@postgres:5432/fluxparcel?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: fluxparcel-api:local
    pull_policy: never
    environment:
      <<: *storage
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "true"
      DATABASE_URL: *database
      REDIS_URL: redis://redis:6379/0
      SMTP_ADDRESS: mail:1025
      SMTP_FROM: verify@fluxparcel.test
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      bucket:
        condition: service_completed_successfully
      mail:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    image: fluxparcel-api:local
    pull_policy: never
    command: ["worker"]
    environment:
      DATABASE_URL: *database
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: fluxparcel-web:local
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres:
  objects:
